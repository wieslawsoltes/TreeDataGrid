name: Uno source diagnostics

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate XAML and record exact input
        shell: bash
        run: |
          mkdir -p artifacts/source
          git rev-parse HEAD > artifacts/source/commit.txt
          git archive --format=tar HEAD > artifacts/source/source.tar
          python3 - <<'PY'
          import hashlib
          import json
          import pathlib
          import subprocess
          import xml.etree.ElementTree as ET

          files = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          manifest = {}
          checked = []
          for name in filter(None, files):
              path = pathlib.Path(name)
              if not path.is_file():
                  continue
              manifest[name] = hashlib.sha256(path.read_bytes()).hexdigest()
              if (name.startswith('src/TreeDataGrid.Controls.Uno/') or
                  name.startswith('samples/TreeDataGridUno')) and path.suffix in ('.xaml', '.csproj'):
                  ET.parse(path)
                  checked.append(name)
          output = pathlib.Path('artifacts/source')
          (output / 'sha256.json').write_text(json.dumps(manifest, indent=2) + '\n')
          (output / 'xml-checked.json').write_text(json.dumps(checked, indent=2) + '\n')
          print(f'XML syntax checked: {len(checked)} files. This is not a XAML compiler or API parity check.')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uno-source-diagnostics
          path: artifacts/source
          if-no-files-found: error
          retention-days: 7
