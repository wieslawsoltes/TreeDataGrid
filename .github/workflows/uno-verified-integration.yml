name: Prepare verified Uno integration

on:
  push:
    branches: [codex/uno-core-port]
    paths: [.github/workflows/uno-verified-integration.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const zlib = require('zlib');
            const cp = require('child_process');
            const input = fs.readFileSync('.github/workflows/uno-reviewed-import.yml', 'utf8');
            let encoded = input.match(/const encoded = '([^']+)';/)[1];
            // Repair a transport transcription, never accept an altered payload.
            encoded = encoded.replace('5nn04vLt6VEyy', '5nn04vLt6+eVEyy');
            const bytes = zlib.gunzipSync(Buffer.from(encoded, 'base64'));
            const hash = data => crypto.createHash('sha256').update(data).digest('hex');
            if (hash(bytes) !== '084645d4e491f4097f8ac7c5cd5bed5ea7f6ed8e681908072d34f34d0d3cac86') throw new Error('Payload is not the reviewed input');
            const payload = JSON.parse(bytes.toString('utf8'));
            const paths = Object.keys(payload.files).sort();
            if (paths.some(path => !/^(src|samples|tests)\//.test(path) || path.split('/').includes('..'))) throw new Error('Invalid source path');
            cp.execFileSync('git', ['apply', '--check', '-'], {input: payload.patch});
            cp.execFileSync('git', ['apply', '-'], {input: payload.patch});
            for (const path of paths) if (hash(fs.readFileSync(path)) !== payload.files[path]) throw new Error('Source hash mismatch: ' + path);
            // Local timing did not justify the broader DP guard changes. Import
            // no objects for those files; they remain unchanged in the branch.
            const rejected = new Set([
              'src/TreeDataGrid.Controls.Uno/Primitives/TreeDataGridCell.cs',
              'src/TreeDataGrid.Controls.Uno/Primitives/TreeDataGridRow.cs']);
            const rows = 'src/TreeDataGrid.Controls.Uno/Primitives/TreeDataGridRowsPresenter.cs';
            let text = fs.readFileSync(rows, 'utf8');
            text = text.replace('        var selected = rowSelected || cellSelected;\n        if (cell.IsSelected != selected) cell.IsSelected = selected;',
              '        cell.IsSelected = rowSelected || cellSelected;');
            text = text.replace('        var current = Owner?.IsCurrentCell(cell.RowIndex, cell.ColumnIndex) == true;\n        if (cell.IsCurrent != current) cell.IsCurrent = current;',
              '        cell.IsCurrent = Owner?.IsCurrentCell(cell.RowIndex, cell.ColumnIndex) == true;');
            fs.writeFileSync(rows, text);
            if (hash(fs.readFileSync(rows)) !== '4ad842e456b19215d49af0e15f9fa40b4a77a5e1d6ede408c181ddbb335b4993') throw new Error('Final rows source mismatch');
            const scope = {owner: context.repo.owner, repo: context.repo.repo};
            const tree = [];
            for (const path of paths.filter(path => !rejected.has(path))) {
              const blob = await github.rest.git.createBlob({...scope, encoding: 'utf-8', content: fs.readFileSync(path, 'utf8')});
              tree.push({path, mode: '100644', type: 'blob', sha: blob.data.sha});
            }
            const report = {base: context.sha, files: tree};
            fs.writeFileSync('verified-source-objects.json', JSON.stringify(report, null, 2));
            console.log('VERIFIED_SOURCE_OBJECTS=' + JSON.stringify(report));
      - uses: actions/upload-artifact@v4
        with:
          name: verified-uno-integration
          path: verified-source-objects.json
          if-no-files-found: error
          retention-days: 1
