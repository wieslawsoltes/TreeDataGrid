name: Uno lazy binding comparison

on:
  push:
    branches: [codex/uno-core-port]
    paths: [.github/workflows/uno-lazy-binding-comparison.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.201
      - name: Install matched native environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb fonts-dejavu-core libfontconfig1 libx11-6 libxrandr2 libxi6 libxcursor1 libgl1
      - name: Compare exact revisions and identical creation harness
        run: |
          python3 -u - <<'PY'
          import hashlib, json, math, os, shutil, signal, statistics, subprocess
          from pathlib import Path
          root = Path.cwd()
          output = (root / 'artifacts/lazy-binding-comparison')
          output.mkdir(parents=True, exist_ok=True)
          revisions = {
              'baseline': '73d4c0f34d17c7b85ab14033bdbf465abeca5a38',
              'candidate': '7de9f507972b0f1ecbfb561b06e0004a630a1690',
          }
          order = ['baseline', 'candidate', 'candidate', 'baseline']
          trees, harnesses = {}, {}
          harness_source = root / 'benchmarks/TreeDataGrid.BindingCreation'
          harness_hashes = {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in harness_source.iterdir() if p.is_file()}
          (output / 'input.json').write_text(json.dumps({'revisions': revisions, 'order': order, 'harnessSha256': harness_hashes}, indent=2) + '\n')
          for label, revision in revisions.items():
              tree = Path(os.environ['RUNNER_TEMP']) / ('lazy-binding-' + label)
              subprocess.run(['git', 'worktree', 'add', '--detach', str(tree), revision], check=True)
              trees[label] = tree
              harness = Path(os.environ['RUNNER_TEMP']) / ('lazy-harness-' + label)
              shutil.copytree(harness_source, harness)
              shutil.copy2(root / 'global.json', harness / 'global.json')
              shutil.copy2(root / 'NuGet.config', harness / 'NuGet.config')
              harnesses[label] = harness
              with (output / ('creation-build-' + label + '.log')).open('w') as log:
                  subprocess.run(['dotnet', 'build', str(harness / 'TreeDataGrid.BindingCreation.csproj'), '-c', 'Release',
                      '-p:TreeDataGridSourceRoot=' + str(tree), '-p:TreeDataGridUnoTargetFrameworks=net10.0'],
                      cwd=tree, stdout=log, stderr=subprocess.STDOUT, check=True, timeout=240)
          creation_reports = {label: [] for label in revisions}
          creation_environment = None
          for ordinal, label in enumerate(order):
              path = output / f'creation-{ordinal:02d}-{label}.json'
              subprocess.run(['dotnet', str(harnesses[label] / 'bin/Release/net10.0/TreeDataGrid.BindingCreation.dll'),
                  revisions[label], str(path)], cwd=trees[label], check=True, timeout=120)
              report = json.loads(path.read_text())
              assert report['revision'] == revisions[label] and len(report['samples']) == 60
              environment = {k: report[k] for k in ('runtime', 'architecture', 'os', 'serverGc', 'batchSize', 'samplesPerModel', 'warmupBatches', 'warmupSize', 'scope')}
              if creation_environment is None: creation_environment = environment
              assert creation_environment == environment
              for sample in report['samples']:
                  assert sample['Count'] == 8192 and sample['Checksum'] == 8192 * len('Same model value')
                  assert sample['AllocatedBytes'] >= 0 and math.isfinite(sample['Milliseconds']) and sample['Milliseconds'] >= 0
              creation_reports[label].append(report)
          creation_comparisons = []
          for kind in ('plain', 'property', 'collection', 'both'):
              entry = {'kind': kind}
              for metric in ('Milliseconds', 'AllocatedBytes'):
                  samples = {label: [s[metric] / s['Count'] for r in runs for s in r['samples'] if s['Kind'] == kind]
                      for label, runs in creation_reports.items()}
                  assert all(len(v) == 30 for v in samples.values())
                  medians = {label: statistics.median(v) for label, v in samples.items()}
                  entry[metric + 'PerCell'] = {'median': medians, 'candidateOverBaseline': medians['candidate'] / medians['baseline']}
              creation_comparisons.append(entry)
          creation_summary = {'revisions': revisions, 'order': order, 'environment': creation_environment,
              'harnessSha256': harness_hashes, 'comparisons': creation_comparisons,
              'scope': 'Identical public managed cell creation/value read/disposal harness; not native controls or frame-time evidence.'}
          (output / 'creation-summary.json').write_text(json.dumps(creation_summary, indent=2) + '\n')
          print('UNO_LAZY_BINDING_CREATION=' + json.dumps(creation_summary), flush=True)

          reports = {label: [] for label in revisions}
          records, native_environment, uno_frames = [], None, None
          for ordinal, label in enumerate(order):
              tree, revision = trees[label], revisions[label]
              folder = tree / 'artifacts/native-parity'
              if folder.exists(): shutil.rmtree(folder)
              name = f'native-{ordinal:02d}-{label}'
              with (output / (name + '.log')).open('w') as log:
                  child = subprocess.Popen(['python3', '-u', 'build/run-native-parity.py', '--pairs', '2',
                      '--columns', '64', '--iterations', '25', '--max-ratio', '1.10'],
                      cwd=tree, stdout=log, stderr=subprocess.STDOUT, start_new_session=True)
                  try: code = child.wait(timeout=480)
                  except subprocess.TimeoutExpired:
                      os.killpg(child.pid, signal.SIGKILL)
                      child.wait()
                      code = 124
              if folder.exists(): shutil.copytree(folder, output / name)
              summary = json.loads((folder / 'summary.json').read_text()) if (folder / 'summary.json').exists() else None
              outcomes = json.loads((folder / 'outcomes.json').read_text()) if (folder / 'outcomes.json').exists() else {}
              record = {'ordinal': ordinal, 'label': label, 'revision': revision, 'exitCode': code, 'hostOutcomes': outcomes, 'summary': summary}
              records.append(record)
              (output / 'native-passes.json').write_text(json.dumps(records, indent=2) + '\n')
              assert summary and summary['revision'] == revision, record
              assert len(outcomes) == 6 and all(value == 0 for value in outcomes.values()), record
              assert summary['diagnosticBudget'] == 1.10 and code == (0 if summary['diagnosticBudgetMet'] else 1), record
              for framework in ('Avalonia', 'Uno'):
                  for pair in range(2):
                      report = json.loads((folder / f'{pair:02d}-{framework}.json').read_text())
                      assert report['revision'] == revision and report['framework'] == framework and len(report['measurements']) == 150
                      matched = {key: report[key] for key in ('workload', 'runtime', 'architecture', 'os', 'serverGc', 'scope')}
                      if native_environment is None: native_environment = matched
                      assert native_environment == matched
                      assert all(s['Frame']['Error'] is None for s in report['measurements'])
                      if framework == 'Uno':
                          frames = [(s['Operation'], s['Iteration'], s['Frame']) for s in report['measurements']]
                          if uno_frames is None: uno_frames = frames
                          assert frames == uno_frames, 'Realized Uno frames changed'
                          reports[label].append(report)
              subprocess.run(['git', 'diff', '--exit-code'], cwd=tree, check=True)
              subprocess.run(['git', 'diff', '--cached', '--exit-code'], cwd=tree, check=True)
              print('UNO_LAZY_BINDING_NATIVE_PASS=' + json.dumps(record), flush=True)
          comparisons = []
          operations = sorted({s['Operation'] for r in reports['baseline'] for s in r['measurements']})
          assert len(operations) == 6
          for operation in operations:
              entry = {'operation': operation}
              for metric in ('SynchronousUiMilliseconds', 'SynchronousUiAllocatedBytes', 'SettledMilliseconds'):
                  samples = {label: [s[metric] for r in runs for s in r['measurements'] if s['Operation'] == operation]
                      for label, runs in reports.items()}
                  assert all(len(v) == 100 and all(math.isfinite(x) and x >= 0 for x in v) for v in samples.values())
                  medians = {label: statistics.median(v) for label, v in samples.items()}
                  entry[metric] = {'samplesPerRevision': 100, 'median': medians,
                      'candidateOverBaseline': medians['candidate'] / medians['baseline'] if medians['baseline'] else None,
                      'p95': {label: sorted(v)[math.ceil(.95 * len(v)) - 1] for label, v in samples.items()}}
              comparisons.append(entry)
          result = {'schemaVersion': 1, 'revisions': revisions, 'revisionOrder': order,
              'frameworkOrderWithinEachPass': 'Avalonia/Uno, Uno/Avalonia', 'environment': native_environment,
              'successfulFrameworkHosts': 16, 'identicalUnoFrameSequences': 8,
              'frameSequenceSha256': hashlib.sha256(json.dumps(uno_frames, sort_keys=True).encode()).hexdigest(),
              'comparisons': comparisons, 'collectionSucceeded': True, 'completePerformanceParityProven': False,
              'scope': 'Exact unmodified revisions on one runner in ABBA order. Pooled medians/p95 are diagnostic, not statistical confidence intervals. All original 1.10 outcomes retained; not frame rate, GPU completion or hierarchy/variable-height acceptance.'}
          (output / 'native-summary.json').write_text(json.dumps(result, indent=2) + '\n')
          print('UNO_LAZY_BINDING_NATIVE_COMPARISON=' + json.dumps(result), flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uno-lazy-binding-comparison
          path: artifacts/lazy-binding-comparison
          retention-days: 14
          if-no-files-found: error
      - name: Require unchanged workflow checkout
        if: always()
        run: git diff --exit-code && git diff --cached --exit-code

  audit-delta:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: uno-validation-report
          run-id: '36197904479'
          github-token: ${{ github.token }}
          path: before
      - uses: actions/download-artifact@v4
        with:
          name: uno-validation-report
          run-id: '36220565971'
          github-token: ${{ github.token }}
          path: after
      - name: Reconcile every changed declared difference against complete archived records
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          def read(folder):
              candidates = [(p, json.loads(p.read_text())) for p in Path(folder).rglob('classified-differences.json')]
              candidates = [(p, d) for p, d in candidates if d]
              assert len(candidates) == 1
              path, differences = candidates[0]
              baseline = json.loads(path.with_name('avalonia.json').read_text())
              target = json.loads(path.with_name('uno.json').read_text())
              summary = json.loads(path.with_name('summary.json').read_text())
              assert len(differences) == summary['missingOrDifferent']
              return {d['Baseline']['Identity']: d for d in differences}, baseline, target, summary
          old, old_baseline, old_target, old_summary = read('before')
          new, new_baseline, new_target, new_summary = read('after')
          assert len(old) == 834 and len(new) == 825
          resolved = []
          target_by_identity = {r['Identity']: r for r in new_target['Entries']}
          for identity in sorted(old.keys() - new.keys()):
              item = old[identity]
              target = target_by_identity[identity]
              current_baseline = next(r for r in new_baseline['Entries'] if r['Identity'] == identity)
              assert current_baseline['Normalized'] == target['Normalized']
              resolved.append({'identity': identity, 'before': item, 'afterBaseline': current_baseline, 'afterTarget': target,
                  'reason': 'implemented-portable-method' if identity.endswith('.TryGetTotalCount(System.Int32@)') else 'canonical-interface-order'})
          assert len(resolved) == 9 and not (new.keys() - old.keys())
          reasons = {reason: sum(r['reason'] == reason for r in resolved) for reason in ('implemented-portable-method', 'canonical-interface-order')}
          assert reasons == {'implemented-portable-method': 3, 'canonical-interface-order': 6}, reasons
          result = {'beforeSummary': old_summary, 'afterSummary': new_summary, 'resolved': resolved, 'reasons': reasons,
              'remainingDeclaredDifferences': 825, 'completeApiParityProven': False,
              'scope': 'Every removed declared difference resolves to an exact verified target record; no Core, native-signature or inherited-member waiver.'}
          Path('audit-delta.json').write_text(json.dumps(result, indent=2) + '\n')
          print('UNO_API_DECLARATION_DELTA=' + json.dumps(result))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uno-api-declaration-delta
          path: audit-delta.json
          if-no-files-found: error
          retention-days: 14
