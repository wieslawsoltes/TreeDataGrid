name: Uno numeric formatting comparison

on:
  push:
    branches: [codex/uno-core-port]
    paths: [.github/workflows/uno-numeric-formatting-comparison.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.201
      # The initial CompositeFormat candidate regressed decimal/string controls.
      # Keep that run, and compare refined direct dispatch against the SAME
      # pre-change baseline with the unchanged ten-workload harness.
      - name: Compare refined numeric dispatch and unchanged controls
        run: >-
          python3 -u build/compare-numeric-formatting.py
          --baseline 603b461eaf16339232628b1490a9847e7fb1cca4
          --candidate "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uno-numeric-formatting-comparison
          path: artifacts/numeric-formatting
          retention-days: 14
          if-no-files-found: error
      - name: Require unchanged product checkout
        if: always()
        run: git diff --exit-code && git diff --cached --exit-code
