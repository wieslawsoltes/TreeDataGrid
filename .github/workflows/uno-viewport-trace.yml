name: Uno viewport trace

on:
  push:
    branches: [codex/uno-core-port]
    paths: [.github/workflows/uno-viewport-trace.yml]
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TreeDataGridUnoSampleTargetFrameworks: net10.0-desktop
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c705eb42fadf2076c12c5bb18ad38497f7837186
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.201
      - name: Add diagnostic-only native viewport traces
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def replace(name, old, new):
              path = Path(name)
              text = path.read_text()
              assert text.count(old) == 1, (name, old)
              path.write_text(text.replace(old, new))
          header = 'src/TreeDataGrid.Controls.Uno/Primitives/TreeDataGridColumnHeadersPresenter.cs'
          replace(header, '        if (needsMeasure) InvalidateMeasure();', '''        Console.WriteLine($"HEADER_UPDATE offset={offset} old={_offset} viewport={viewport} actual={ActualWidth}x{ActualHeight} effective={Viewport} config={configurationChanged} geometry={geometryChanged} needs={needsMeasure}");
                  if (needsMeasure) InvalidateMeasure();''')
          replace(header, '    protected override Size MeasureOverride(Size availableSize)\n    {', '''    protected override void OnEffectiveViewportChanged(object? sender, EffectiveViewportChangedEventArgs e)
              {
                  Console.WriteLine($"HEADER_EFFECTIVE old={Viewport} new={e.EffectiveViewport} actual={ActualWidth}x{ActualHeight}");
                  base.OnEffectiveViewportChanged(sender, e);
              }
              protected override Size MeasureOverride(Size availableSize)
              {
                  Console.WriteLine($"HEADER_MEASURE constraint={availableSize} effective={Viewport} parent={GetParentPresenterViewPort()}");''')
          test = 'samples/TreeDataGridUnoSample/ViewportMeasurementRuntimeChecks.cs'
          replace(test, '            grid.Scroll.ChangeView(9, null, null, true);',
              '            Console.WriteLine("COVERED_MOVE_BEGIN");\n            grid.Scroll.ChangeView(9, null, null, true);')
          replace(test, '            Check(Math.Abs(grid.Scroll.HorizontalOffset - 9) < 0.1,',
              '            Console.WriteLine("COVERED_MOVE_END");\n            Check(Math.Abs(grid.Scroll.HorizontalOffset - 9) < 0.1,')
          replace(test, '            measurements[rowIndex] = measurements.GetValueOrDefault(rowIndex) + 1;',
              '            Console.WriteLine($"COLUMN_MEASURE row={rowIndex} width={width}");\n            measurements[rowIndex] = measurements.GetValueOrDefault(rowIndex) + 1;')
          PY
      - name: Build and execute the failing regression
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libfontconfig1 libx11-6 libxrandr2 libxi6 libxcursor1 libgl1
          dotnet build samples/TreeDataGridUnoSample/TreeDataGridUnoSample.csproj -c Release -f net10.0-desktop
          mkdir -p artifacts
          python3 -u - <<'PY'
          import subprocess
          from pathlib import Path
          path = Path('artifacts/viewport-trace.log')
          with path.open('w') as log:
              result = subprocess.run(['xvfb-run','-a','dotnet','run','--project','samples/TreeDataGridUnoSample/TreeDataGridUnoSample.csproj','--no-build','-c','Release','-f','net10.0-desktop','--','--smoke','--suite','viewport-measurement'], stdout=log, stderr=subprocess.STDOUT, timeout=120)
          print('REGRESSION_EXIT', result.returncode)
          lines = path.read_text(errors='replace').splitlines()
          start = next((i for i,line in enumerate(lines) if 'COVERED_MOVE_BEGIN' in line), max(0,len(lines)-80))
          print('\n'.join(lines[max(0,start-35):]))
          assert result.returncode != 0 and any('Covered horizontal scrolling repeated' in line for line in lines), 'The expected uncorrected regression was not reproduced'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uno-viewport-trace
          path: artifacts
          retention-days: 7
