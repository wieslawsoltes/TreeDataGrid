name: Uno validation report

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uno-validation-report-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-committed-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      TreeDataGridUnoSampleTargetFrameworks: net10.0-desktop
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.201
      - name: Install native runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libfontconfig1 libx11-6 libxrandr2 libxi6 libxcursor1 libgl1
      - name: Validate the checked-out sources without modifying them
        run: |
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/validated-revision.txt
          dotnet --info > artifacts/dotnet-info.txt
          python3 -u build/validate-uno-linux.py
      - name: Publish full evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uno-validation-report
          path: artifacts
          if-no-files-found: error
          retention-days: 14
      - name: Require an unchanged source checkout
        if: always()
        run: git diff --exit-code && git diff --cached --exit-code
