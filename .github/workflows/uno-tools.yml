name: Uno tools

# Manual tools that publish offline development and validation inputs as artifacts.
on:
  workflow_dispatch:
    inputs:
      tool:
        description: Tool to run
        required: true
        type: choice
        options: [dependency-snapshot, reference-packs, offline-inputs]

permissions:
  contents: read

jobs:
  dependency-snapshot:
    if: inputs.tool == 'dependency-snapshot'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NUGET_PACKAGES: /tmp/treedatagrid-parity-packages
      TreeDataGridUnoSampleTargetFrameworks: net10.0-desktop
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.201
      - name: Restore the current native validation projects
        run: |
          dotnet restore tests/TreeDataGrid.Core.Tests/TreeDataGrid.Core.Tests.csproj
          dotnet restore samples/TreeDataGridUnoSample.Tests/TreeDataGridUnoSample.Tests.csproj
          dotnet restore samples/TreeDataGridUnoSample/TreeDataGridUnoSample.csproj
          dotnet restore samples/TreeDataGridUnoActivityMonitor/TreeDataGridUnoActivityMonitor.csproj
          dotnet restore tests/TreeDataGrid.Uno.Tests/TreeDataGrid.Uno.Tests.csproj -p:TreeDataGridUnoTargetFrameworks=net10.0
          dotnet restore tests/Avalonia.Controls.TreeDataGrid.Tests/Avalonia.Controls.TreeDataGrid.Tests.csproj
          dotnet restore benchmarks/TreeDataGrid.Parity.Avalonia/TreeDataGrid.Parity.Avalonia.csproj
          dotnet restore benchmarks/TreeDataGrid.Parity.Uno/TreeDataGrid.Parity.Uno.csproj
          dotnet restore tools/TreeDataGrid.ApiAudit/TreeDataGrid.ApiAudit.csproj
      - name: Archive only public NuGet package files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, tarfile
          root = Path('/tmp/treedatagrid-parity-packages')
          output = Path('package-inputs'); output.mkdir()
          batches, batch, size = [], [], 0
          manifest = {}
          for path in sorted(root.rglob('*.nupkg')):
              length = path.stat().st_size
              if batch and size + length > 300 * 1024 * 1024:
                  batches.append(batch); batch, size = [], 0
              batch.append(path); size += length
              manifest[path.name] = hashlib.sha256(path.read_bytes()).hexdigest()
          if batch: batches.append(batch)
          assert len(batches) <= 5, 'More package partitions than configured uploads'
          for index, paths in enumerate(batches):
              with tarfile.open(output / f'packages-{index:02d}.tar', 'w') as archive:
                  for path in paths: archive.add(path, arcname=path.name)
          (output / 'sha256.json').write_text(json.dumps(manifest, indent=2))
          print(f'{len(manifest)} packages in {len(batches)} partitions')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: uno-packages-00
          path: package-inputs/packages-00.tar
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: uno-packages-01
          path: package-inputs/packages-01.tar
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: uno-packages-02
          path: package-inputs/packages-02.tar
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: uno-packages-03
          path: package-inputs/packages-03.tar
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: uno-packages-04
          path: package-inputs/packages-04.tar
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: uno-packages-manifest
          path: package-inputs/sha256.json
          retention-days: 1

  reference-packs:
    if: inputs.tool == 'reference-packs'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.201
      - name: Snapshot installed reference packs and net8 runtime
        shell: bash
        run: |
          mkdir -p artifacts
          dotnet --info > artifacts/dotnet-info.txt
          root="$(dirname "$(readlink -f "$(command -v dotnet)")")"
          cd "$root"
          # No home directory, configuration, tokens, fonts or workload caches.
          tar -czf "$GITHUB_WORKSPACE/artifacts/reference-packs.tar.gz" packs/Microsoft.NETCore.App.Ref packs/Microsoft.AspNetCore.App.Ref packs/Microsoft.NETCore.App.Host.linux-x64 shared/Microsoft.NETCore.App/8.*
          cd "$GITHUB_WORKSPACE/artifacts"
          sha256sum reference-packs.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: uno-reference-packs
          path: artifacts
          if-no-files-found: error
          retention-days: 7

  offline-inputs:
    if: inputs.tool == 'offline-inputs'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      TreeDataGridUnoSampleTargetFrameworks: net10.0-desktop
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.201
      - name: Restore exact development inputs
        run: |
          dotnet restore solutions/TreeDataGrid.Uno.slnx
          dotnet restore tests/TreeDataGrid.Parity.Tests/TreeDataGrid.Parity.Tests.csproj
          dotnet restore tests/Avalonia.Controls.TreeDataGrid.Tests/Avalonia.Controls.TreeDataGrid.Tests.csproj
          dotnet restore benchmarks/TreeDataGrid.Parity.Avalonia/TreeDataGrid.Parity.Avalonia.csproj
          dotnet restore benchmarks/TreeDataGrid.Parity.Uno/TreeDataGrid.Parity.Uno.csproj
          dotnet restore tools/TreeDataGrid.ApiAudit/TreeDataGrid.ApiAudit.csproj
      - name: Archive public assets only
        run: |
          mkdir -p artifacts/offline "$RUNNER_TEMP/offline/dotnet/sdk" "$RUNNER_TEMP/offline/nuget/packages"
          dotnet --info > artifacts/offline/dotnet-info.txt
          git rev-parse HEAD > artifacts/offline/revision.txt
          git bundle create artifacts/offline/source.bundle HEAD
          cp /usr/share/dotnet/dotnet "$RUNNER_TEMP/offline/dotnet/"
          cp -a /usr/share/dotnet/host "$RUNNER_TEMP/offline/dotnet/"
          mkdir -p "$RUNNER_TEMP/offline/dotnet/shared/Microsoft.NETCore.App"
          cp -a /usr/share/dotnet/shared/Microsoft.NETCore.App/8.* /usr/share/dotnet/shared/Microsoft.NETCore.App/10.* "$RUNNER_TEMP/offline/dotnet/shared/Microsoft.NETCore.App/"
          cp -a /usr/share/dotnet/packs "$RUNNER_TEMP/offline/dotnet/"
          cp -a /usr/share/dotnet/sdk/10.0.201 "$RUNNER_TEMP/offline/dotnet/sdk/"
          if test -d /usr/share/dotnet/sdk-manifests; then cp -a /usr/share/dotnet/sdk-manifests "$RUNNER_TEMP/offline/dotnet/"; fi
          python3 - <<'PY'
          import json, os, shutil
          from pathlib import Path
          cache = Path.home()/'.nuget/packages'
          target = Path(os.environ['RUNNER_TEMP'])/'offline/nuget/packages'
          paths = {'uno.sdk/6.7.30'}
          for assets in Path('.').rglob('project.assets.json'):
              for library in json.loads(assets.read_text())['libraries'].values():
                  if library.get('type') == 'package': paths.add(library['path'])
          for path in sorted(paths):
              source = cache/path
              if source.is_dir():
                  shutil.copytree(source, target/path, ignore=shutil.ignore_patterns('*.nupkg'))
          print('SELECTED_PUBLIC_PACKAGES=', len(paths))
          PY
          du -sh "$RUNNER_TEMP/offline/"*
          tar -C "$RUNNER_TEMP/offline" -I 'gzip -1' -cf "$RUNNER_TEMP/public-toolchain.tar.gz" dotnet nuget
          split -b 450M -d "$RUNNER_TEMP/public-toolchain.tar.gz" artifacts/offline/toolchain.part-
          sha256sum artifacts/offline/toolchain.part-* artifacts/offline/source.bundle > artifacts/offline/SHA256SUMS
          test ! -f artifacts/offline/toolchain.part-08
      - uses: actions/upload-artifact@v4
        with:
          name: uno-offline-manifest
          path: |
            artifacts/offline/SHA256SUMS
            artifacts/offline/source.bundle
            artifacts/offline/dotnet-info.txt
            artifacts/offline/revision.txt
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: uno-offline-part-00
          path: artifacts/offline/toolchain.part-00
          retention-days: 3
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: hashFiles('artifacts/offline/toolchain.part-01') != ''
        with:
          name: uno-offline-part-01
          path: artifacts/offline/toolchain.part-01
          retention-days: 3
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: hashFiles('artifacts/offline/toolchain.part-02') != ''
        with:
          name: uno-offline-part-02
          path: artifacts/offline/toolchain.part-02
          retention-days: 3
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: hashFiles('artifacts/offline/toolchain.part-03') != ''
        with:
          name: uno-offline-part-03
          path: artifacts/offline/toolchain.part-03
          retention-days: 3
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: hashFiles('artifacts/offline/toolchain.part-04') != ''
        with:
          name: uno-offline-part-04
          path: artifacts/offline/toolchain.part-04
          retention-days: 3
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: hashFiles('artifacts/offline/toolchain.part-05') != ''
        with:
          name: uno-offline-part-05
          path: artifacts/offline/toolchain.part-05
          retention-days: 3
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: hashFiles('artifacts/offline/toolchain.part-06') != ''
        with:
          name: uno-offline-part-06
          path: artifacts/offline/toolchain.part-06
          retention-days: 3
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: hashFiles('artifacts/offline/toolchain.part-07') != ''
        with:
          name: uno-offline-part-07
          path: artifacts/offline/toolchain.part-07
          retention-days: 3
          compression-level: 0
      - name: Require unchanged product checkout
        run: git diff --exit-code && git diff --cached --exit-code
