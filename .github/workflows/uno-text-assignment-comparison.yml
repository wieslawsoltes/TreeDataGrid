name: Uno native text assignment comparison

# The measured candidate was withdrawn after a resize regression. Keep the
# original exact-source experiment reproducible; do not remeasure a docs head
# or silently substitute the retained runtime for the historical candidate.
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Exact candidate commit; the collector verifies every changed path
        type: string
        default: c7ae9344e6afc77432ab4f449306d29da22c3efa
        required: true

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.201
      - name: Install native runtime prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb fonts-dejavu-core libfontconfig1 libx11-6 libxrandr2 libxi6 libxcursor1 libgl1
      - name: Exercise collector negative controls
        run: python3 build/test-native-text-assignment-comparison.py
      - name: Compare exact active-state native revisions in ABBA order
        env:
          CANDIDATE: ${{ inputs.candidate }}
        run: python3 -u build/compare-native-text-assignment.py --candidate "$CANDIDATE"
      - name: Preserve all measured outcomes and source identity
        if: always()
        run: |
          mkdir -p artifacts/native-text-assignment
          git rev-parse HEAD > artifacts/native-text-assignment/checked-out-revision.txt
          git rev-parse HEAD^{tree} > artifacts/native-text-assignment/checked-out-tree.txt
          dotnet --info > artifacts/native-text-assignment/dotnet-info.txt
          git diff --exit-code
          git diff --cached --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uno-native-text-assignment-comparison
          path: artifacts/native-text-assignment
          if-no-files-found: error
          retention-days: 14
