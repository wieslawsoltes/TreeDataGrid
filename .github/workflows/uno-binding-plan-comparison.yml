name: Uno binding instruction plan comparison

on:
  push:
    branches: [codex/uno-core-port]
    paths: [.github/workflows/uno-binding-plan-comparison.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.201
      - name: Compare immutable source revisions in ABBA order
        run: >-
          python3 -u build/compare-binding-plan-execution.py
          --baseline 920e2f9ec0469817f2688d9bd069698d32704e10
          --candidate "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uno-binding-plan-comparison
          path: artifacts/binding-plan-comparison
          retention-days: 14
          if-no-files-found: error
      - name: Require unchanged source checkout
        if: always()
        run: git diff --exit-code && git diff --cached --exit-code
