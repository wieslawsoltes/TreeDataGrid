name: Uno

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uno-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: Uno build and unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      TreeDataGridUnoSampleTargetFrameworks: net10.0-desktop
      # Native WinUI is built with Visual Studio MSBuild in its own job.
      TreeDataGridUnoTargetFrameworks: net10.0;net10.0-desktop
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.201
      - name: Core tests
        run: dotnet test tests/TreeDataGrid.Core.Tests/TreeDataGrid.Core.Tests.csproj -c Release --logger trx --results-directory artifacts/core-tests
      - name: Uno presentation tests
        run: dotnet test tests/TreeDataGrid.Uno.Tests/TreeDataGrid.Uno.Tests.csproj -c Release -p:TreeDataGridUnoTargetFrameworks=net10.0 --logger trx --results-directory artifacts/uno-tests
      - name: Uno solution build
        run: dotnet build solutions/TreeDataGrid.Uno.slnx -c Release
      - name: Uno sample state tests
        run: dotnet test samples/TreeDataGridUnoSample.Tests/TreeDataGridUnoSample.Tests.csproj -c Release --logger trx --results-directory artifacts/uno-sample-tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uno-tests-${{ matrix.os }}
          path: artifacts/**/*tests/*.trx
          if-no-files-found: warn

  native-runtime:
    name: Uno native runtime (Linux X11)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TreeDataGridUnoSampleTargetFrameworks: net10.0-desktop
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.201
      - name: Install X11 runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libfontconfig1 libx11-6 libxrandr2 libxi6 libxcursor1 libgl1
      - name: Build native showcase
        run: dotnet build samples/TreeDataGridUnoSample/TreeDataGridUnoSample.csproj -c Release -f net10.0-desktop
      - name: Isolated native suites
        id: isolated
        continue-on-error: true
        run: python3 build/run-uno-native-suites.py --jobs 3
      - name: Sequential native regression checks
        id: sequential
        continue-on-error: true
        run: >-
          xvfb-run -a -s "-screen 0 1280x800x24"
          dotnet run --project samples/TreeDataGridUnoSample/TreeDataGridUnoSample.csproj
          --no-build -c Release -f net10.0-desktop -- --smoke
          --screenshot-dir "$GITHUB_WORKSPACE/artifacts/uno"
      - name: Pack shared Core and Uno controls
        run: |
          dotnet pack src/TreeDataGrid.Core/TreeDataGrid.Core.csproj -c Release -p:PackageVersion=12.0.0.7-ci.${{ github.run_id }} -o artifacts/uno-pack
          dotnet pack src/TreeDataGrid.Controls.Uno/TreeDataGrid.Controls.Uno.csproj -c Release -p:PackageVersion=12.0.0.7-ci.${{ github.run_id }} -o artifacts/uno-pack
      - name: Run Activity Monitor native checks
        run: >-
          xvfb-run -a -s "-screen 0 1280x800x24"
          dotnet run --project samples/TreeDataGridUnoActivityMonitor/TreeDataGridUnoActivityMonitor.csproj
          -c Release -f net10.0-desktop -- --smoke --demo
          --screenshot-dir "$GITHUB_WORKSPACE/artifacts/uno"
      - name: Validate Activity Monitor package consumer
        run: >-
          xvfb-run -a -s "-screen 0 1280x800x24"
          dotnet run --project samples/TreeDataGridUnoActivityMonitor/TreeDataGridUnoActivityMonitor.csproj
          -c Release -f net10.0-desktop
          -p:TreeDataGridUnoPackageVersion=12.0.0.7-ci.${{ github.run_id }}
          -p:RestoreAdditionalProjectSources="$GITHUB_WORKSPACE/artifacts/uno-pack"
          -- --smoke --demo
      - name: Validate native package consumer
        id: package
        continue-on-error: true
        run: >-
          xvfb-run -a -s "-screen 0 1280x800x24"
          dotnet run --project samples/TreeDataGridUnoSample/TreeDataGridUnoSample.csproj
          -c Release -f net10.0-desktop
          -p:TreeDataGridUnoPackageVersion=12.0.0.7-ci.${{ github.run_id }}
          -p:RestoreAdditionalProjectSources="$GITHUB_WORKSPACE/artifacts/uno-pack"
          -- --smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uno-native-renders-and-results
          path: |
            artifacts/uno
            artifacts/uno-native-suites
            artifacts/uno-pack
          if-no-files-found: warn
      - name: Require all native gates
        if: always()
        env:
          ISOLATED_RESULT: ${{ steps.isolated.outcome }}
          SEQUENTIAL_RESULT: ${{ steps.sequential.outcome }}
          PACKAGE_RESULT: ${{ steps.package.outcome }}
        run: test "$ISOLATED_RESULT" = success && test "$SEQUENTIAL_RESULT" = success && test "$PACKAGE_RESULT" = success

  browser-build:
    name: Uno browser samples and package consumers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TreeDataGridUnoSampleTargetFrameworks: net10.0-browserwasm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.201
      - name: Install browser workload
        run: dotnet workload install wasm-tools
      - name: Build both browser samples
        run: |
          dotnet build samples/TreeDataGridUnoSample/TreeDataGridUnoSample.csproj -c Release -f net10.0-browserwasm
          dotnet build samples/TreeDataGridUnoActivityMonitor/TreeDataGridUnoActivityMonitor.csproj -c Release -f net10.0-browserwasm
      - name: Pack shared Core and Uno library
        run: |
          dotnet pack src/TreeDataGrid.Core/TreeDataGrid.Core.csproj -c Release -p:PackageVersion=12.0.0.7-ci.${{ github.run_id }} -o artifacts/uno-pack
          dotnet pack src/TreeDataGrid.Controls.Uno/TreeDataGrid.Controls.Uno.csproj -c Release -p:PackageVersion=12.0.0.7-ci.${{ github.run_id }} -o artifacts/uno-pack
      - name: Publish browser package consumers
        run: |
          dotnet publish samples/TreeDataGridUnoSample/TreeDataGridUnoSample.csproj -c Release -f net10.0-browserwasm -p:TreeDataGridUnoPackageVersion=12.0.0.7-ci.${{ github.run_id }} -p:RestoreAdditionalProjectSources="$GITHUB_WORKSPACE/artifacts/uno-pack" -o artifacts/browser/showcase
          dotnet publish samples/TreeDataGridUnoActivityMonitor/TreeDataGridUnoActivityMonitor.csproj -c Release -f net10.0-browserwasm -p:TreeDataGridUnoPackageVersion=12.0.0.7-ci.${{ github.run_id }} -p:RestoreAdditionalProjectSources="$GITHUB_WORKSPACE/artifacts/uno-pack" -o artifacts/browser/monitor
      - uses: actions/upload-artifact@v4
        with:
          name: uno-browser-samples
          path: artifacts/browser
          if-no-files-found: error

  windows-app-sdk-build:
    name: Native Windows App SDK samples and package consumers
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      TreeDataGridUnoSampleTargetFrameworks: net10.0-windows10.0.26100
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.201
      - uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64
      - name: Build native Windows samples
        run: |
          foreach ($name in @('TreeDataGridUnoSample', 'TreeDataGridUnoActivityMonitor')) {
            $project = "samples/$name/$name.csproj"
            # Restore the project graph WITHOUT a global TargetFramework, which
            # would incorrectly retarget the shared net8.0 Core dependency.
            msbuild $project -t:Restore -v:minimal -p:Configuration=Release -p:RuntimeIdentifier=win-x64
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            msbuild $project -t:Build -v:minimal -p:Configuration=Release -p:TargetFramework=net10.0-windows10.0.26100 -p:RuntimeIdentifier=win-x64
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Pack all Core and Uno framework assets
        run: |
          dotnet pack src/TreeDataGrid.Core/TreeDataGrid.Core.csproj -c Release -p:PackageVersion=12.0.0.7-ci.${{ github.run_id }} -o artifacts/uno-pack
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          msbuild src/TreeDataGrid.Controls.Uno/TreeDataGrid.Controls.Uno.csproj -restore -t:Pack -v:minimal -p:Configuration=Release -p:PackageVersion=12.0.0.7-ci.${{ github.run_id }} -p:PackageOutputPath="$env:GITHUB_WORKSPACE/artifacts/uno-pack"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish native Windows package consumers
        run: |
          foreach ($item in @(@('TreeDataGridUnoSample', 'showcase'), @('TreeDataGridUnoActivityMonitor', 'monitor'))) {
            $project = "samples/$($item[0])/$($item[0]).csproj"
            $common = @('-p:Configuration=Release', '-p:RuntimeIdentifier=win-x64', '-p:TreeDataGridUnoPackageVersion=12.0.0.7-ci.${{ github.run_id }}', "-p:RestoreAdditionalProjectSources=$env:GITHUB_WORKSPACE/artifacts/uno-pack")
            msbuild $project -t:Restore -v:minimal @common
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            msbuild $project -t:Publish -v:minimal @common -p:TargetFramework=net10.0-windows10.0.26100 "-p:PublishDir=$env:GITHUB_WORKSPACE/artifacts/windows/$($item[1])/"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: uno-windows-app-sdk-samples
          path: artifacts/windows
          if-no-files-found: error
