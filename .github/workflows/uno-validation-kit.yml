name: Uno offline validation kit

# Rebuild only when this recipe changes, or explicitly on demand.
on:
  push:
    paths: [.github/workflows/uno-validation-kit.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validation-kit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Reuse the exact public SDK/package snapshot from this PR's successful
      # restore. Split it without changing its contents or evaluating user code.
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 35650268309
          name: uno-offline-validation-kit
          path: kit
      - name: Split portable validation archives below transfer limits
        shell: bash
        run: |
          cd kit
          sha256sum --check SHA256SUMS
          mkdir -p ../artifacts/metadata ../artifacts/parts
          cp source.tar SHA256SUMS commit.txt dotnet-info.txt ../artifacts/metadata/
          tar -cf ../artifacts/archives.tar dotnet.tar.gz packages.tar.gz
          cd ../artifacts
          sha256sum archives.tar > metadata/archives.sha256
          split -b 400M -d -a 2 archives.tar parts/kit.part
          ls -lh parts/
      - uses: actions/upload-artifact@v4
        with:
          name: uno-kit-metadata
          path: artifacts/metadata
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: uno-kit-part00
          path: artifacts/parts/kit.part00
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: uno-kit-part01
          path: artifacts/parts/kit.part01
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: uno-kit-part02
          path: artifacts/parts/kit.part02
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: uno-kit-part03
          path: artifacts/parts/kit.part03
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: uno-kit-part04
          path: artifacts/parts/kit.part04
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: uno-kit-part05
          path: artifacts/parts/kit.part05
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 7
