name: Uno offline validation kit

# The large artifact is rebuilt only when this recipe changes, or on demand;
# ordinary source pushes continue to use the lightweight Uno test matrix.
on:
  push:
    paths: [.github/workflows/uno-validation-kit.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation-kit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_INSTALL_DIR: ${{ runner.temp }}/treedatagrid-dotnet
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      TreeDataGridUnoTargetFrameworks: net10.0-desktop
      TreeDataGridUnoSampleTargetFrameworks: net10.0-desktop
      NUGET_PACKAGES: ${{ runner.temp }}/treedatagrid-packages
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.201
      - name: Restore the exact validation dependencies
        shell: bash
        run: |
          dotnet restore tests/TreeDataGrid.Core.Tests/TreeDataGrid.Core.Tests.csproj
          dotnet restore tests/TreeDataGrid.Uno.Tests/TreeDataGrid.Uno.Tests.csproj -p:TreeDataGridUnoTargetFrameworks=net10.0
          dotnet restore samples/TreeDataGridUnoSample/TreeDataGridUnoSample.csproj
          dotnet restore samples/TreeDataGridUnoActivityMonitor/TreeDataGridUnoActivityMonitor.csproj
          dotnet restore samples/TreeDataGridUnoSample.Tests/TreeDataGridUnoSample.Tests.csproj
      - name: Package the isolated toolchain and public package cache
        shell: bash
        run: |
          mkdir -p artifacts/validation-kit
          dotnet --info > artifacts/validation-kit/dotnet-info.txt
          git rev-parse HEAD > artifacts/validation-kit/commit.txt
          git archive --format=tar HEAD > artifacts/validation-kit/source.tar
          # These directories were created specifically for this job. Never
          # archive a runner home, NuGet.Config, .git, credentials or environment.
          tar -czf artifacts/validation-kit/dotnet.tar.gz -C "$DOTNET_INSTALL_DIR" .
          tar -czf artifacts/validation-kit/packages.tar.gz -C "$NUGET_PACKAGES" .
          cd artifacts/validation-kit
          sha256sum *.tar* > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: uno-offline-validation-kit
          path: artifacts/validation-kit
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
