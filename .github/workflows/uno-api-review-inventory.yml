name: Uno API review inventory

on:
  push:
    branches: [codex/uno-core-port]
    paths: [.github/workflows/uno-api-review-inventory.yml]
  workflow_dispatch:
    inputs:
      validation_run:
        description: Completed Uno validation report run to inspect
        type: string
        default: '36271915158'
        required: true

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: uno-validation-report
          run-id: ${{ inputs.validation_run || '36271915158' }}
          github-token: ${{ github.token }}
          path: report
      - name: Summarize canonical declaration gaps
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('report/api-audit/classified-differences.json')
          differences = json.loads(path.read_text())
          summary = json.loads(path.with_name('summary.json').read_text())
          scopes = json.loads(path.with_name('scope-accounting.json').read_text())
          if len(differences) != summary['missingOrDifferent']:
              raise RuntimeError('Declared difference count does not reconcile')
          inherited = {r['Baseline']['Identity'] for r in scopes['InheritedMemberReviews']}
          for category in sorted({row['Category'] for row in differences}):
              rows = [row for row in differences if row['Category'] == category]
              print('CATEGORY=' + category + ' COUNT=' + str(len(rows)))
              if len(rows) not in (43, 74):
                  continue
              for row in rows:
                  baseline = row['Baseline']
                  print(('INHERITED ' if baseline['Identity'] in inherited else 'ABSENT ') + baseline['Raw'])
          print('Diagnostic only: no raw difference is waived.')
          PY
