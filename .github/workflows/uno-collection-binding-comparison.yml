name: Uno collection binding comparison

on:
  push:
    branches: [codex/uno-core-port]
    paths: [.github/workflows/uno-collection-binding-comparison.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.201
      - name: Install matched native environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb fonts-dejavu-core libfontconfig1 libx11-6 libxrandr2 libxi6 libxcursor1 libgl1
      - name: Run pinned collector with the narrower candidate
        run: |
          python3 -u - <<'PY'
          import hashlib, json, subprocess, textwrap
          from pathlib import Path
          collector_revision = '8c798ad4a10bc93ae9f2fe624d224543117956eb'
          original_candidate = '7de9f507972b0f1ecbfb561b06e0004a630a1690'
          candidate = '0fefe457352c7a5929d80c4202b68f451ee39c89'
          workflow = subprocess.check_output([
              'git', 'show', collector_revision + ':.github/workflows/uno-lazy-binding-comparison.yml'
          ], text=True)
          # Pin and extract only the previously reviewed standard-library Python
          # collector, not a mutable action or a dynamically downloaded program.
          marker = '          import hashlib, json, math, os, shutil, signal, statistics, subprocess\n'
          if workflow.count(marker) != 1:
              raise RuntimeError('Pinned collector start is ambiguous')
          start = workflow.index(marker)
          end = workflow.index('\n          PY\n', start)
          original = textwrap.dedent(workflow[start:end]) + '\n'
          if original.count(original_candidate) != 1:
              raise RuntimeError('Expected exactly one candidate revision in pinned collector')
          modified = original.replace(original_candidate, candidate)
          output = Path('artifacts/lazy-binding-comparison')
          output.mkdir(parents=True, exist_ok=True)
          (output / 'collector-provenance.json').write_text(json.dumps({
              'collectorRevision': collector_revision,
              'baseline': '73d4c0f34d17c7b85ab14033bdbf465abeca5a38',
              'candidate': candidate,
              'originalCollectorSha256': hashlib.sha256(original.encode()).hexdigest(),
              'executedCollectorSha256': hashlib.sha256(modified.encode()).hexdigest(),
              'collectorChange': 'Candidate revision only; workloads, ABBA order, frame validation and 1.10 outcomes unchanged.'
          }, indent=2) + '\n')
          exec(compile(modified, 'pinned-lazy-binding-collector.py', 'exec'), {'__name__': '__main__'})
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uno-collection-binding-comparison
          path: artifacts/lazy-binding-comparison
          retention-days: 14
          if-no-files-found: error
      - name: Require unchanged workflow checkout
        if: always()
        run: git diff --exit-code && git diff --cached --exit-code
