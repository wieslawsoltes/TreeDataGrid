name: Uno performance investigation

# Diagnostic-only: checked-in revisions are never edited or published. The
# independent paired-native-performance workflow retains the 1.10 hard gate.
on:
  push:
    branches: [codex/uno-core-port]
    paths: [.github/workflows/uno-performance-investigation.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-and-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.201
      - name: Install matched native and diagnostic tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb fonts-dejavu-core libfontconfig1 libx11-6 libxrandr2 libxi6 libxcursor1 libgl1
          dotnet tool install dotnet-trace --tool-path "$RUNNER_TEMP/trace-tools" --version 10.0.745401
      - name: Compare unchanged baseline and candidate on this machine
        shell: bash
        run: |
          python3 -u - <<'PY'
          import json, os, shutil, signal, subprocess
          from pathlib import Path
          output = Path('artifacts/investigation').resolve()
          output.mkdir(parents=True, exist_ok=True)
          revisions = {
              'baseline': '49b026561fdc6beb89f44d628256e5564e653de4',
              'candidate': '8fd1e5dc726a995a12b3a80964c6a7a5a92bb344',
          }
          results = {}
          worktrees = {}
          for label, revision in revisions.items():
              tree = Path(os.environ['RUNNER_TEMP']) / ('uno-investigation-' + label)
              subprocess.run(['git', 'worktree', 'add', '--detach', str(tree), revision], check=True)
              worktrees[label] = tree
              with (output / (label + '.log')).open('w') as log:
                  process = subprocess.Popen(['python3', '-u', 'build/run-native-parity.py', '--pairs', '2', '--columns', '64', '--iterations', '25', '--max-ratio', '1.10'], cwd=tree, stdout=log, stderr=subprocess.STDOUT, start_new_session=True)
                  try: code = process.wait(timeout=600)
                  except subprocess.TimeoutExpired:
                      os.killpg(process.pid, signal.SIGKILL)
                      process.wait()
                      code = 124
              report_dir = tree / 'artifacts/native-parity'
              if report_dir.exists(): shutil.copytree(report_dir, output / label)
              report = json.loads((report_dir / 'summary.json').read_text()) if (report_dir / 'summary.json').exists() else None
              outcomes = json.loads((report_dir / 'outcomes.json').read_text())
              results[label] = {'revision': revision, 'exitCode': code, 'hostOutcomes': outcomes, 'report': report}
              (output / 'results.json').write_text(json.dumps(results, indent=2) + '\n')
              assert report and len(outcomes) == 6 and all(value == 0 for value in outcomes.values()), results[label]
              subprocess.run(['git', 'diff', '--exit-code'], cwd=tree, check=True)
              subprocess.run(['git', 'diff', '--cached', '--exit-code'], cwd=tree, check=True)
          compared = []
          old = {item['operation']: item for item in results['baseline']['report']['comparisons']}
          for item in results['candidate']['report']['comparisons']:
              operation = item['operation']
              entry = {'operation': operation}
              for metric in ['SynchronousUiMilliseconds', 'SynchronousUiAllocatedBytes', 'SettledMilliseconds']:
                  before = old[operation][metric]['median']['Uno']
                  after = item[metric]['median']['Uno']
                  entry[metric] = {'before': before, 'after': after, 'afterOverBefore': after / before if before else None}
              compared.append(entry)
          summary = {'scope': 'Same runner, baseline then candidate. Each revision uses matched AB/BA framework processes. Sequential revision order can affect timings; profiling below is separate.', 'completePerformanceParityProven': False, 'comparisons': compared}
          (output / 'before-after.json').write_text(json.dumps(summary, indent=2) + '\n')
          print('UNO_SAME_RUNNER_COMPARISON=' + json.dumps(summary), flush=True)
          PY
      - name: Collect profiles separately from uninstrumented acceptance measurements
        shell: bash
        run: |
          set -o pipefail
          output="$GITHUB_WORKSPACE/artifacts/investigation/profiles"
          mkdir -p "$output"
          export PARITY_COLUMNS=64 PARITY_ITERATIONS=200
          export PARITY_REVISION=8fd1e5dc726a995a12b3a80964c6a7a5a92bb344
          trace="$RUNNER_TEMP/trace-tools/dotnet-trace"
          "$trace" --version > "$output/tool-version.txt"
          for framework in Uno Avalonia; do
            if [ "$framework" = Uno ]; then tfm=net10.0-desktop; else tfm=net10.0; fi
            export PARITY_OUTPUT="$output/$framework-profiled-workload.json"
            app="$RUNNER_TEMP/uno-investigation-candidate/benchmarks/TreeDataGrid.Parity.$framework/bin/Release/$tfm/TreeDataGrid.Parity.$framework.dll"
            timeout --kill-after=10s 240s xvfb-run -a -s '-screen 0 1280x800x24' "$trace" collect --profile dotnet-sampled-thread-time,dotnet-common --output "$output/$framework.nettrace" -- dotnet "$app" > "$output/$framework-collect.log" 2>&1
            "$trace" report "$output/$framework.nettrace" topN -n 80 --inclusive --verbose | tee "$output/$framework-inclusive.txt"
            "$trace" report "$output/$framework.nettrace" topN -n 80 --verbose | tee "$output/$framework-exclusive.txt"
            "$trace" convert "$output/$framework.nettrace" --format Speedscope --output "$output/$framework" > "$output/$framework-convert.log" 2>&1
          done
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path('artifacts/investigation/profiles')
          for framework in ('Uno', 'Avalonia'):
              report = json.loads((root / (framework + '-profiled-workload.json')).read_text())
              assert report['framework'] == framework and len(report['measurements']) == 1200
              assert all(sample['Frame']['Error'] is None for sample in report['measurements'])
          (root / 'SCOPE.txt').write_text('Instrumented managed sampled-thread-time profiles include initialization and asynchronous/render threads. They are diagnostic attribution, not the uninstrumented performance acceptance results.\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uno-performance-investigation
          path: artifacts/investigation
          retention-days: 7
          if-no-files-found: error
      - name: Require unchanged source checkout
        if: always()
        run: git diff --exit-code && git diff --cached --exit-code
