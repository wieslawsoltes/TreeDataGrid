name: Uno row recycling candidate

# Temporary branch-only review harness. No reference updates or package releases.
on:
  push:
    branches: [codex/uno-core-port]
    paths: [.github/workflows/uno-visibility-candidate.yml, .github/uno-visibility-candidate.py]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      TreeDataGridUnoSampleTargetFrameworks: net10.0-desktop
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.201
      - name: Install matched native environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb fonts-dejavu-core libfontconfig1 libx11-6 libxrandr2 libxi6 libxcursor1 libgl1
      - name: Measure unchanged source on this runner
        id: before
        continue-on-error: true
        run: python3 -u build/run-native-parity.py --pairs 2 --columns 64 --iterations 25 --max-ratio 1.10
      - name: Preserve baseline and apply exact candidate
        run: |
          mv artifacts/native-parity artifacts/native-parity-before
          python3 .github/uno-visibility-candidate.py
          git diff --check
          git diff > artifacts/visibility-candidate/source.patch
      - name: Execute all unit and native regression gates
        id: validation
        continue-on-error: true
        run: python3 -u build/validate-uno-linux.py
      - name: Measure candidate on the same runner
        id: after
        continue-on-error: true
        run: python3 -u build/run-native-parity.py --pairs 2 --columns 64 --iterations 25 --max-ratio 1.10
      - name: Record candidate Git objects without updating a branch
        uses: actions/github-script@v7
        env:
          VALIDATION_RESULT: ${{ steps.validation.outcome }}
          BEFORE_RESULT: ${{ steps.before.outcome }}
          AFTER_RESULT: ${{ steps.after.outcome }}
        with:
          script: |
            const fs = require('fs');
            const scope = {owner: context.repo.owner, repo: context.repo.repo};
            const paths = JSON.parse(fs.readFileSync('artifacts/visibility-candidate/files.json', 'utf8'));
            const base = await github.rest.git.getCommit({...scope, commit_sha: context.sha});
            const changes = [];
            for (const path of paths) {
              const blob = await github.rest.git.createBlob({...scope, encoding: 'utf-8', content: fs.readFileSync(path, 'utf8')});
              changes.push({path, mode: '100644', type: 'blob', sha: blob.data.sha});
            }
            for (const path of ['.github/uno-visibility-candidate.py', '.github/workflows/uno-visibility-candidate.yml'])
              changes.push({path, mode: '100644', type: 'blob', sha: null});
            const tree = await github.rest.git.createTree({...scope, base_tree: base.data.tree.sha, tree: changes});
            const commit = await github.rest.git.createCommit({...scope, tree: tree.data.sha, parents: [context.sha],
              message: 'Avoid redundant cell visibility changes during parent-row recycling'});
            const report = {base: context.sha, commit: commit.data.sha, tree: tree.data.sha, changes,
              validation: process.env.VALIDATION_RESULT, before: process.env.BEFORE_RESULT, after: process.env.AFTER_RESULT,
              note: 'Candidate source changes were tested before reference promotion; recorded file/tree hashes identify them. Performance budget failures remain failures.'};
            fs.writeFileSync('artifacts/visibility-candidate/report.json', JSON.stringify(report, null, 2));
            console.log('VISIBILITY_CANDIDATE=' + JSON.stringify(report));
            const before = JSON.parse(fs.readFileSync('artifacts/native-parity-before/summary.json', 'utf8'));
            const after = JSON.parse(fs.readFileSync('artifacts/native-parity/summary.json', 'utf8'));
            for (const current of after.comparisons) {
              const previous = before.comparisons.find(item => item.operation === current.operation);
              console.log('SAME_RUNNER_COMPARISON=' + JSON.stringify({operation: current.operation,
                beforeMs: previous.SynchronousUiMilliseconds.median.Uno, afterMs: current.SynchronousUiMilliseconds.median.Uno,
                beforeBytes: previous.SynchronousUiAllocatedBytes.median.Uno, afterBytes: current.SynchronousUiAllocatedBytes.median.Uno,
                candidateUnoOverAvalonia: current.SynchronousUiMilliseconds.unoOverAvalonia}));
            }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uno-row-recycling-candidate
          path: artifacts
          if-no-files-found: error
          retention-days: 7
      - name: Require correctness and complete performance evidence
        env:
          VALIDATION_RESULT: ${{ steps.validation.outcome }}
        run: |
          test "$VALIDATION_RESULT" = success
          python3 - <<'PY'
          import json
          from pathlib import Path
          for folder in ['native-parity-before', 'native-parity']:
              report = json.loads(Path('artifacts', folder, 'summary.json').read_text())
              assert len(report['comparisons']) == 6
              print(folder, 'budget met:', report['diagnosticBudgetMet'])
          PY
