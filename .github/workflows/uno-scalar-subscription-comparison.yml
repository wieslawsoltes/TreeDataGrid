name: Uno scalar subscription comparison

on:
  push:
    branches: [codex/uno-core-port]
    paths: [.github/workflows/uno-scalar-subscription-comparison.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.201
      # Keep the generic-helper experiment and all adverse controls in history.
      # This revision specializes the attachment overloads; all ten workloads,
      # all 32 regressions, runtime defaults and original baseline stay fixed.
      - name: Compare concrete observer dispatch and constructor regressions
        run: python3 -u build/compare-scalar-subscriptions.py --baseline 31f9857801a890e8a760aaafc318d383daacc1ff --candidate "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uno-scalar-subscription-comparison
          path: artifacts/scalar-subscriptions
          retention-days: 14
          if-no-files-found: error
      - name: Require unchanged checked-out sources
        if: always()
        run: git diff --exit-code && git diff --cached --exit-code
