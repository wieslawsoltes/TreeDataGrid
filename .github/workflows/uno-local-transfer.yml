name: Uno exact local source transfer
on:
  push:
    branches: [codex/uno-core-port]
    paths: [.github/workflows/uno-local-transfer.yml]
permissions:
  contents: write
jobs:
  transfer:
    if: github.repository == 'wieslawsoltes/TreeDataGrid' && github.ref == 'refs/heads/codex/uno-core-port'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read the locally prepared patch from immutable Git blobs
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const scope = {owner: context.repo.owner, repo: context.repo.repo};
            const hashes = ['03fab947dc6d8688955a820916ca490b9c65f35e', 'f187da338ae60c46a3f2ecdf6a12a34b32300026', 'd1f460b10281e11267efe5b4ec7e5182d1168ef4', 'b43f0db94f315cac4b609082e909363272b10e7b'];
            let encoded = '';
            for (const sha of hashes) {
              const blob = (await github.rest.git.getBlob({...scope, file_sha: sha})).data;
              encoded += Buffer.from(blob.content, 'base64').toString('utf8');
            }
            fs.mkdirSync('artifacts/local-transfer', {recursive: true});
            fs.writeFileSync('artifacts/local-transfer/patch-base64.txt', encoded);
      - name: Restore exact reviewed local patch and verify its complete tree
        shell: python
        run: |
          import base64, hashlib, json, pathlib, subprocess, zlib
          output = pathlib.Path('artifacts/local-transfer')
          encoded = (output / 'patch-base64.txt').read_text()
          patch = zlib.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '501f99fa9c882ba1f7919e486a75aeb48784b343e6a66e7e4cd7e81650b9511f'
          (output / 'source.patch').write_bytes(patch)
          subprocess.run(['git', 'apply', '--index', str(output / 'source.patch')], check=True)
          subprocess.run(['git', 'rm', '.github/workflows/uno-local-transfer.yml'], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          assert tree == '010f3531fc77b77bbf8f7584b98d270180e1c27a', tree
          entries = [line.split('\t', 1) for line in subprocess.check_output(['git', 'diff', '--cached', '--name-status'], text=True).splitlines()]
          (output / 'entries.json').write_text(json.dumps(entries))
      - name: Create reviewable Git objects without moving any branch
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const scope = {owner: context.repo.owner, repo: context.repo.repo};
            const base = (await github.rest.git.getCommit({...scope, commit_sha: context.sha})).data;
            const entries = JSON.parse(fs.readFileSync('artifacts/local-transfer/entries.json', 'utf8'));
            const changes = [];
            for (const [status, path] of entries) {
              if (status === 'D') changes.push({path, mode: '100644', type: 'blob', sha: null});
              else {
                const blob = await github.rest.git.createBlob({...scope, encoding: 'utf-8', content: fs.readFileSync(path, 'utf8')});
                changes.push({path, mode: '100644', type: 'blob', sha: blob.data.sha});
              }
            }
            const tree = (await github.rest.git.createTree({...scope, base_tree: base.tree.sha, tree: changes})).data;
            if (tree.sha !== '010f3531fc77b77bbf8f7584b98d270180e1c27a') throw new Error('Remote tree mismatch: ' + tree.sha);
            const commit = (await github.rest.git.createCommit({...scope, tree: tree.sha, parents: [context.sha], message: 'Fix compiled image completion and native shutdown; reduce recycling allocations and execute browser consumers'})).data;
            const report = {base: context.sha, commit: commit.sha, tree: tree.sha, changes, note: 'Exact local source transfer only. No branch references changed. Standard validation executes after manual fast-forward.'};
            fs.writeFileSync('artifacts/local-transfer/report.json', JSON.stringify(report, null, 2));
            console.log('UNO_LOCAL_TRANSFER=' + JSON.stringify(report));
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uno-local-source-transfer
          path: artifacts/local-transfer
          if-no-files-found: error
          retention-days: 14
