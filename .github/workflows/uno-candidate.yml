name: Uno candidate validation

# Temporary repair harness: create reviewable objects, never update refs/publish.
on:
  push:
    branches: [codex/uno-core-port]
    paths: [.github/workflows/uno-candidate.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      TreeDataGridUnoSampleTargetFrameworks: net10.0-desktop
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.201
      - name: Apply reviewed test and sample compiler corrections
        run: |
          mkdir -p artifacts/candidate artifacts/logs
          python3 - <<'PY'
          from pathlib import Path
          import json
          changed = []
          def replace(name, old, new, count=1):
              path = Path(name)
              text = path.read_text()
              matches = text.count(old)
              assert matches > 0 and (count is None or matches == count), (name, old, matches)
              path.write_text(text.replace(old, new))
              if name not in changed: changed.append(name)
          tests = 'tests/TreeDataGrid.Uno.Tests/'
          sample = 'samples/TreeDataGridUnoSample/'
          replace(tests + 'SelectionTests.cs', '        Uno.Controls.Selection.ITreeDataGridSelectionInteraction interaction',
              '        global::Uno.Controls.Selection.ITreeDataGridSelectionInteraction interaction')
          replace(tests + 'ColumnListCompatibilityTests.cs', '        Assert.Equal(1, columns.Count);', '        Assert.Single(columns);')
          replace(sample + 'AppearanceRuntimeChecks.cs', 'Colors.Fuchsia', 'Microsoft.UI.Colors.Fuchsia')
          replace(sample + 'PresentationOptionsRuntimeChecks.cs', '(ValueColumn<Item, string>)column', '(ValueColumn<Item, string?>)column')
          replace(sample + 'FocusRuntimeChecks.cs', 'FocusManager.GetFocusedElement(grid.XamlRoot)',
              'FocusManager.GetFocusedElement(grid.XamlRoot ?? throw new InvalidOperationException("The focus fixture must be attached to a XamlRoot."))', count=None)
          replace(sample + 'StandaloneRowRuntimeChecks.cs', 'new TextColumn<Item, string>(', 'new TreeDataGridCore.Models.TextColumn<Item, string>(')
          replace(sample + 'ViewportCacheRuntimeChecks.cs', 'grid.TryGetRow(0)?.Model == items[0]', 'ReferenceEquals(grid.TryGetRow(0)?.Model, items[0])')
          replace(sample + 'MainPage.xaml', ' AutomationProperties.LiveSetting="Polite"', '')
          replace(sample + 'MainPage.xaml.cs', '        InitializeComponent();', '''        InitializeComponent();
                  // Preserve live-region metadata on implemented native heads without
                  // invoking the generated Uno stub on unsupported renderers.
                  if (Windows.Foundation.Metadata.ApiInformation.IsMethodPresent(
                      "Microsoft.UI.Xaml.Automation.AutomationProperties", "SetLiveSetting"))
                  {
          #pragma warning disable Uno0001 // The implemented capability is checked above.
                      Microsoft.UI.Xaml.Automation.AutomationProperties.SetLiveSetting(
                          DragStatus, Microsoft.UI.Xaml.Automation.Peers.AutomationLiveSetting.Polite);
          #pragma warning restore Uno0001
                  }''')
          Path('artifacts/candidate/files.json').write_text(json.dumps(changed))
          PY
          git diff --check
          git diff --stat
      - name: Core regression and allocation tests
        id: core
        continue-on-error: true
        run: dotnet test tests/TreeDataGrid.Core.Tests/TreeDataGrid.Core.Tests.csproj -c Release --logger trx --results-directory artifacts/core-tests > artifacts/logs/core.log 2>&1
      - name: Uno presentation tests
        id: uno
        continue-on-error: true
        run: dotnet test tests/TreeDataGrid.Uno.Tests/TreeDataGrid.Uno.Tests.csproj -c Release -p:TreeDataGridUnoTargetFrameworks=net10.0 --logger trx --results-directory artifacts/uno-tests > artifacts/logs/uno.log 2>&1
      - name: Build native Uno sample
        id: native
        continue-on-error: true
        run: dotnet build samples/TreeDataGridUnoSample/TreeDataGridUnoSample.csproj -c Release -f net10.0-desktop > artifacts/logs/native-build.log 2>&1
      - name: Build native activity monitor
        id: activity
        continue-on-error: true
        run: dotnet build samples/TreeDataGridUnoActivityMonitor/TreeDataGridUnoActivityMonitor.csproj -c Release -f net10.0-desktop > artifacts/logs/activity-build.log 2>&1
      - name: Install X11 smoke dependencies
        if: steps.native.outcome == 'success' || steps.activity.outcome == 'success'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libx11-dev libxxf86vm-dev libxrandr-dev libxi-dev libxcursor-dev libxext-dev libxrender-dev libxfixes-dev libfontconfig-dev libxss-dev libegl1-mesa-dev libgl1-mesa-dev x11proto-dev xvfb
      - name: Native sample runtime gates
        id: smoke
        if: steps.native.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 3
        run: xvfb-run -a dotnet run --project samples/TreeDataGridUnoSample/TreeDataGridUnoSample.csproj --no-build -c Release -f net10.0-desktop -- --native-smoke --screenshot artifacts/native-smoke/treedatagrid-x11.png > artifacts/logs/native-smoke.log 2>&1
      - name: Native activity monitor stress gates
        id: stress
        if: steps.activity.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 3
        run: xvfb-run -a dotnet run --project samples/TreeDataGridUnoActivityMonitor/TreeDataGridUnoActivityMonitor.csproj --no-build -c Release -f net10.0-desktop -- --native-smoke --auto-stress --screenshot artifacts/native-smoke/activity-x11.png > artifacts/logs/activity-smoke.log 2>&1
      - name: Record candidate without changing any reference
        uses: actions/github-script@v7
        if: always() && steps.core.outcome != 'skipped'
        env:
          CORE_RESULT: ${{ steps.core.outcome }}
          UNO_RESULT: ${{ steps.uno.outcome }}
          NATIVE_RESULT: ${{ steps.native.outcome }}
          ACTIVITY_RESULT: ${{ steps.activity.outcome }}
          SMOKE_RESULT: ${{ steps.smoke.outcome }}
          STRESS_RESULT: ${{ steps.stress.outcome }}
        with:
          script: |
            const fs = require('fs');
            const paths = JSON.parse(fs.readFileSync('artifacts/candidate/files.json', 'utf8'));
            const scope = {owner: context.repo.owner, repo: context.repo.repo};
            const base = await github.rest.git.getCommit({...scope, commit_sha: context.sha});
            const tree = [];
            for (const path of paths) {
              const blob = await github.rest.git.createBlob({...scope, content: fs.readFileSync(path, 'utf8'), encoding: 'utf-8'});
              tree.push({path, mode: '100644', type: 'blob', sha: blob.data.sha});
            }
            const result = await github.rest.git.createTree({...scope, base_tree: base.data.tree.sha, tree});
            const candidate = await github.rest.git.createCommit({...scope,
              message: 'Correct Uno native sample and regression test compilation',
              tree: result.data.sha, parents: [context.sha]});
            const report = {base: context.sha, commit: candidate.data.sha, tree: result.data.sha,
              core: process.env.CORE_RESULT, uno: process.env.UNO_RESULT, native: process.env.NATIVE_RESULT,
              activity: process.env.ACTIVITY_RESULT, smoke: process.env.SMOKE_RESULT, stress: process.env.STRESS_RESULT, files: tree};
            fs.writeFileSync('artifacts/candidate/report.json', JSON.stringify(report, null, 2));
            console.log('UNO_CANDIDATE_REPORT=' + JSON.stringify(report));
            for (const name of fs.readdirSync('artifacts/logs')) {
              const lines = fs.readFileSync('artifacts/logs/' + name, 'utf8').split('\n');
              console.log('VALIDATION_LOG ' + name + '\n' + lines.filter(line => /error |Failed!|Passed!|\[FAIL\]|UNO_|Exception|Build succeeded|Error Message:|Stack Trace:|Expected:|Actual:/.test(line)).join('\n'));
              console.log('LOG_TAIL ' + name + '\n' + lines.slice(-35).join('\n'));
            }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uno-candidate-validation
          path: artifacts
          if-no-files-found: error
          retention-days: 7
      - name: Enforce actual validation outcomes
        if: always()
        env:
          CORE_RESULT: ${{ steps.core.outcome }}
          UNO_RESULT: ${{ steps.uno.outcome }}
          NATIVE_RESULT: ${{ steps.native.outcome }}
          ACTIVITY_RESULT: ${{ steps.activity.outcome }}
          SMOKE_RESULT: ${{ steps.smoke.outcome }}
          STRESS_RESULT: ${{ steps.stress.outcome }}
        run: test "$CORE_RESULT" = success && test "$UNO_RESULT" = success && test "$NATIVE_RESULT" = success && test "$ACTIVITY_RESULT" = success && test "$SMOKE_RESULT" = success && test "$STRESS_RESULT" = success
