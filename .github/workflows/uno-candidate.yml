name: Uno candidate validation

# Temporary repair harness. Only the explicitly scoped candidate script changes
# input files; source results become unreferenced objects for connector review.
on:
  push:
    branches: [codex/uno-core-port]
    paths: [.github/workflows/uno-candidate.yml, .github/uno-candidate.py]
permissions:
  contents: write
concurrency:
  group: uno-candidate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      TreeDataGridUnoSampleTargetFrameworks: net10.0-desktop
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.201
      - name: Apply reviewed candidate
        run: |
          mkdir -p artifacts/candidate artifacts/logs
          python3 .github/uno-candidate.py
          git diff --check
          git diff --stat
      - name: Install X11 dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libfontconfig1 libx11-6 libxrandr2 libxi6 libxcursor1 libgl1
      - name: Run independent validation gates
        run: |
          python3 -u - <<'PY'
          import json, subprocess, signal, os
          from pathlib import Path
          results = {}
          def run(name, args, prerequisite=None, timeout=240):
              if prerequisite is not None and results.get(prerequisite) != 0:
                  results[name] = 'not-run: prerequisite failed'
                  return
              print('START ' + name, flush=True)
              with Path('artifacts/logs/' + name + '.log').open('w') as log:
                  process = subprocess.Popen(args, stdout=log, stderr=subprocess.STDOUT, start_new_session=True)
                  try: results[name] = process.wait(timeout=timeout)
                  except subprocess.TimeoutExpired:
                      os.killpg(process.pid, signal.SIGKILL)
                      process.wait()
                      results[name] = 124
              print('RESULT ' + name + '=' + str(results[name]), flush=True)
              lines = Path('artifacts/logs/' + name + '.log').read_text(errors='replace').splitlines()
              print('\n'.join(lines[-70:]), flush=True)
              Path('artifacts/candidate/outcomes.json').write_text(json.dumps(results))
          run('core', ['dotnet','test','tests/TreeDataGrid.Core.Tests/TreeDataGrid.Core.Tests.csproj','-c','Release','--logger','trx','--results-directory','artifacts/core-tests'])
          run('uno', ['dotnet','test','tests/TreeDataGrid.Uno.Tests/TreeDataGrid.Uno.Tests.csproj','-c','Release','-p:TreeDataGridUnoTargetFrameworks=net10.0','--logger','trx','--results-directory','artifacts/uno-tests'])
          run('avalonia', ['dotnet','test','tests/Avalonia.Controls.TreeDataGrid.Tests/Avalonia.Controls.TreeDataGrid.Tests.csproj','-c','Release','--logger','trx','--results-directory','artifacts/avalonia-tests'])
          run('sample-state', ['dotnet','test','samples/TreeDataGridUnoSample.Tests/TreeDataGridUnoSample.Tests.csproj','-c','Release','--logger','trx','--results-directory','artifacts/sample-tests'])
          for name, project in [('native','TreeDataGridUnoSample'), ('activity','TreeDataGridUnoActivityMonitor')]:
              run(name, ['dotnet','build',f'samples/{project}/{project}.csproj','-c','Release','-f','net10.0-desktop'])
              extra = ['--demo'] if name == 'activity' else []
              run(name + '-smoke', ['xvfb-run','-a','-s','-screen 0 1280x800x24','dotnet','run','--project',f'samples/{project}/{project}.csproj','--no-build','-c','Release','-f','net10.0-desktop','--','--smoke',*extra], prerequisite=name)
          run('isolated-suites', ['python3','build/run-uno-native-suites.py','--jobs','3'], prerequisite='native', timeout=360)
          run('avalonia-api-build', ['dotnet','build','src/TreeDataGrid.Avalonia/TreeDataGrid.Avalonia.csproj','-c','Release'])
          core = 'src/TreeDataGrid.Core/bin/Release/net8.0/TreeDataGrid.Core.dll'
          target = 'src/TreeDataGrid.Controls.Uno/bin/Release/net10.0-desktop/TreeDataGrid.Controls.Uno.dll'
          baseline = 'src/TreeDataGrid.Avalonia/bin/Release/net8.0/TreeDataGrid.Avalonia.dll'
          run('api-audit', ['dotnet','run','--project','tools/TreeDataGrid.ApiAudit','-c','Release','--',baseline,target,core,'artifacts/api-audit'], prerequisite='avalonia-api-build')
          run('api-self-check', ['dotnet','run','--project','tools/TreeDataGrid.ApiAudit','--no-build','-c','Release','--',target,target,core,'artifacts/api-self-check'], prerequisite='api-audit')
          Path('artifacts/candidate/outcomes.json').write_text(json.dumps(results))
          PY
      - name: Record reviewed source objects without updating a branch
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const paths = JSON.parse(fs.readFileSync('artifacts/candidate/files.json', 'utf8'));
            if (paths.some(path => path.startsWith('.github/workflows/'))) throw new Error('Workflow edits must use the authorized connector, not the job token.');
            const outcomes = JSON.parse(fs.readFileSync('artifacts/candidate/outcomes.json', 'utf8'));
            const scope = {owner: context.repo.owner, repo: context.repo.repo};
            const base = await github.rest.git.getCommit({...scope, commit_sha: context.sha});
            const tree = [];
            for (const path of paths) {
              const blob = await github.rest.git.createBlob({...scope, content: fs.readFileSync(path, 'utf8'), encoding: 'utf-8'});
              tree.push({path, mode: '100644', type: 'blob', sha: blob.data.sha});
            }
            console.log('UNO_CANDIDATE_BLOBS=' + JSON.stringify(tree));
            const result = await github.rest.git.createTree({...scope, base_tree: base.data.tree.sha, tree});
            const candidate = await github.rest.git.createCommit({...scope,
              message: 'Validate independent native suites and compiled API contracts', tree: result.data.sha, parents: [context.sha]});
            const report = {base: context.sha, commit: candidate.data.sha, tree: result.data.sha, outcomes, files: tree};
            fs.writeFileSync('artifacts/candidate/report.json', JSON.stringify(report, null, 2));
            console.log('UNO_CANDIDATE_REPORT=' + JSON.stringify(report));
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uno-candidate-validation
          path: artifacts
          if-no-files-found: error
          retention-days: 7
      - name: Require successful exit codes and a valid self-diff
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          outcomes = json.loads(Path('artifacts/candidate/outcomes.json').read_text())
          print(outcomes)
          assert len(outcomes) == 12 and all(result == 0 for result in outcomes.values()), outcomes
          report = json.loads(Path('artifacts/api-self-check/summary.json').read_text())
          assert report['missingOrDifferent'] == 0 and report['additionalOrDifferent'] == 0
          PY
