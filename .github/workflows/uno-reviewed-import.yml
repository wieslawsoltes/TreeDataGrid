name: Import verified Uno source objects

on:
  push:
    branches: [codex/uno-core-port]
    paths: [.github/workflows/uno-reviewed-import.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify and import tested source objects without updating references
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const zlib = require('zlib');
            const cp = require('child_process');
            const encoded = '';
            const bytes = zlib.gunzipSync(Buffer.from(encoded, 'base64'));
            const hash = data => crypto.createHash('sha256').update(data).digest('hex');
            if (hash(bytes) !== '32aac69c3c4d04cf56153940ef1a22490f25b9b71c0e6c8c47ebde533cec454c') throw new Error('Reviewed payload hash mismatch');
            const payload = JSON.parse(bytes.toString('utf8'));
            const paths = Object.keys(payload.files).sort();
            if (paths.some(path => !/^(src|samples|tests|benchmarks)\//.test(path) || path.split('/').includes('..'))) throw new Error('Invalid source path');
            cp.execFileSync('git', ['apply', '--check', '-'], {input: payload.patch});
            cp.execFileSync('git', ['apply', '-'], {input: payload.patch});
            for (const path of paths) if (hash(fs.readFileSync(path)) !== payload.files[path]) throw new Error('Source hash mismatch: ' + path);
            const scope = {owner: context.repo.owner, repo: context.repo.repo};
            const tree = [];
            for (const path of paths) {
              const result = await github.rest.git.createBlob({...scope, encoding: 'utf-8', content: fs.readFileSync(path, 'utf8')});
              tree.push({path, mode: '100644', type: 'blob', sha: result.data.sha});
            }
            fs.writeFileSync('verified-source-objects.json', JSON.stringify({base: context.sha, files: tree}, null, 2));
            console.log('VERIFIED_SOURCE_OBJECTS=' + JSON.stringify({base: context.sha, files: tree}));
      - uses: actions/upload-artifact@v4
        with:
          name: verified-uno-source-objects
          path: verified-source-objects.json
          if-no-files-found: error
          retention-days: 1
