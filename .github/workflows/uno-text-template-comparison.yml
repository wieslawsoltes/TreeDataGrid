name: Uno native text template comparison

on:
  push:
    branches: [codex/uno-core-port]
    paths:
      - .github/workflows/uno-text-template-comparison.yml
      - build/compare-native-text-template.py
      - build/verify-flat-text-template.py
      - build/test-flat-text-template.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.201
      - name: Install matched native dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb fonts-dejavu-core libfontconfig1 libx11-6 libxrandr2 libxi6 libxcursor1 libgl1
      - name: Check equivalent active-state control and visual reference
        run: python3 build/test-flat-text-template.py
      - name: Compare exact active-state templates in ABBA order
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/text-template-driver
          python3 -u build/compare-native-text-template.py --baseline f1fb840ac12aca8851fd5d55589b80ece72bf6fc --candidate "$GITHUB_SHA" 2>&1 | tee artifacts/text-template-driver/execution.log
      - name: Preserve every result including preflight and negative original-gate outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-text-template-comparison
          path: |
            artifacts/text-template-native-comparison
            artifacts/text-template-driver
          retention-days: 14
          if-no-files-found: error
      - name: Require unchanged validation sources
        if: always()
        run: git diff --exit-code && git diff --cached --exit-code
