name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 11.0.10)"
        required: true
        type: string
      prerelease:
        description: "Is this a pre-release?"
        required: false
        type: boolean
        default: false
      symbol_repair_run_id:
        description: "Source release run ID for a TreeDataGrid symbol-only repair"
        required: false
        type: string

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

permissions:
  contents: read

jobs:
  build:
    name: Build Release
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.symbol_repair_run_id == '' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is-prerelease: ${{ steps.version.outputs.is-prerelease }}
      tag-name: ${{ steps.version.outputs.tag-name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Determine version
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="$RELEASE_VERSION"
            IS_PRERELEASE="$RELEASE_PRERELEASE"
            TAG_NAME="v$VERSION"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            if [[ "$VERSION" == *"-"* ]]; then
              IS_PRERELEASE="true"
            else
              IS_PRERELEASE="false"
            fi
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+){2,3}(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::Expected a three- or four-part NuGet version with an optional prerelease suffix."
            exit 1
          fi

          {
            echo "version=$VERSION"
            echo "is-prerelease=$IS_PRERELEASE"
            echo "tag-name=$TAG_NAME"
          } >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION (prerelease: $IS_PRERELEASE)"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore -p:Version="${{ steps.version.outputs.version }}"

  test:
    name: Test Release
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.symbol_repair_run_id == '' }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      actions: read
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore -p:Version="${{ needs.build.outputs.version }}"

      - name: Test
        run: dotnet test -c Release --no-build --logger trx --results-directory artifacts/test

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-test-results
          path: artifacts/test/**/*.trx
          if-no-files-found: error
          retention-days: 7

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Release Test Results
          path: artifacts/test/**/*.trx
          reporter: dotnet-trx
          fail-on-empty: false

  pack:
    name: Pack Release
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.symbol_repair_run_id == '' }}
    runs-on: ubuntu-latest
    needs: [build, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore -p:Version="${{ needs.build.outputs.version }}"

      - name: Pack
        run: dotnet pack -c Release --no-build -p:Version="${{ needs.build.outputs.version }}" -o artifacts/packages

      - name: Verify package layout
        run: python3 build/verify-package-layout.py artifacts/packages "${{ needs.build.outputs.version }}"

      - name: Smoke-test TreeDataGrid.Controls.Avalonia package
        run: >-
          dotnet run --project tests/TreeDataGrid.Avalonia.PackageSmoke
          -c Release
          -p:PackageSmokeVersion="${{ needs.build.outputs.version }}"
          -p:PackageSmokeSource="$GITHUB_WORKSPACE/artifacts/packages"

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: release-nuget-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error
          retention-days: 90

  publish-nuget:
    name: Publish to NuGet
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.symbol_repair_run_id == '' }}
    runs-on: ubuntu-latest
    needs: [build, pack]
    environment: nuget
    permissions:
      actions: read
      id-token: write
    steps:
      - name: Download NuGet packages
        uses: actions/download-artifact@v4
        with:
          name: release-nuget-packages
          path: packages

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Authenticate with NuGet Trusted Publishing
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          shopt -s nullglob
          for package in packages/*.nupkg; do
            if [[ "$package" == *.snupkg ]]; then
              continue
            fi
            echo "Publishing $package..."
            dotnet nuget push "$package" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --no-symbols \
              --skip-duplicate
          done
          for package in packages/*.snupkg; do
            echo "Publishing $package..."
            dotnet nuget push "$package" \
              --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

  create-release:
    name: Create GitHub Release
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.symbol_repair_run_id == '' }}
    runs-on: ubuntu-latest
    needs: [build, pack, publish-nuget]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download NuGet packages
        uses: actions/download-artifact@v4
        with:
          name: release-nuget-packages
          path: packages

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: TreeDataGrid v${{ needs.build.outputs.version }}
          tag_name: ${{ needs.build.outputs.tag-name }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: ${{ needs.build.outputs.is-prerelease == 'true' }}
          generate_release_notes: true
          files: |
            packages/*.nupkg
            packages/*.snupkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  repair-symbols:
    name: Repair TreeDataGrid symbols
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.symbol_repair_run_id != '' }}
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Download original release packages
        uses: actions/download-artifact@v4
        with:
          name: release-nuget-packages
          path: packages
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.inputs.symbol_repair_run_id }}

      - name: Verify original DLL/PDB pair
        run: |
          package="packages/TreeDataGrid.$RELEASE_VERSION.nupkg"
          symbols="packages/TreeDataGrid.$RELEASE_VERSION.snupkg"
          test -f "$package"
          test -f "$symbols"
          package_pdb=$(zipinfo -1 "$package" | grep -E '^lib/.+/Avalonia\.Controls\.TreeDataGrid\.pdb$')
          symbols_pdb=$(zipinfo -1 "$symbols" | grep -E '^lib/.+/Avalonia\.Controls\.TreeDataGrid\.pdb$')
          test "$package_pdb" = "$symbols_pdb"
          cmp <(unzip -p "$package" "$package_pdb") <(unzip -p "$symbols" "$symbols_pdb")

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Authenticate with NuGet Trusted Publishing
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Re-upload matching symbol package
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: >-
          dotnet nuget push
          "packages/TreeDataGrid.$RELEASE_VERSION.snupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
