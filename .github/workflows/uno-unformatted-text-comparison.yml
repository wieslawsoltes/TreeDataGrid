name: Uno unformatted text and declared policy comparison

on:
  push:
    branches: [codex/uno-core-port]
    paths: [.github/workflows/uno-unformatted-text-comparison.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.201
      # Initial collection is retained. The corrected fixture compares Auto
      # units, not the platforms' different unused numeric payloads. Product,
      # reader, all workloads and measurement policy remain unchanged.
      - name: Compare exact sources with corrected Auto-unit contract assertions
        run: >-
          python3 -u build/compare-unformatted-text.py
          --baseline 4f2dc4cc96043fb33dc157d76b96d63e8c62b366
          --candidate "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uno-unformatted-text-comparison
          path: artifacts/unformatted-text
          retention-days: 14
          if-no-files-found: error
      - name: Require unchanged checked-out sources
        if: always()
        run: git diff --exit-code && git diff --cached --exit-code
