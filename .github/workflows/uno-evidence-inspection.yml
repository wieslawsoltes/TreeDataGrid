name: Uno evidence inspection

# Read existing evidence only; no candidate or branch is modified.
on:
  push:
    branches: [codex/uno-core-port]
    paths: [.github/workflows/uno-evidence-inspection.yml]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: wieslawsoltes/TreeDataGrid
          run-id: 35837913991
          name: uno-viewport-candidate
          path: evidence
      - name: Print actual failures and outstanding control members
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('evidence')
          print('OUTCOMES', (root / 'validation-outcomes.json').read_text())
          summary = json.loads((root / 'uno-native-suites/summary.json').read_text())
          for result in summary['results']:
              if result['passed']:
                  continue
              print('\nNATIVE_FAILURE', result['suite'])
              text = (root / 'uno-native-suites' / result['log']).read_text(errors='replace')
              print('\n'.join(text.splitlines()[:45]))
          print('\nSEQUENTIAL_FAILURE')
          lines = (root / 'logs/native-smoke.log').read_text(errors='replace').splitlines()
          print('\n'.join(lines[-55:]))
          differences = json.loads((root / 'api-audit/classified-differences.json').read_text())
          print('\nCLASSIFICATION_SAMPLE', json.dumps(differences[:1]))
          for difference in differences:
              category = difference.get('Category', difference.get('category'))
              baseline = difference.get('Baseline', difference.get('baseline', {}))
              identity = baseline.get('Identity', baseline.get('identity', ''))
              if category == 'member-not-declared-on-matched-type':
                  print('MISSING_MEMBER', json.dumps(difference))
          PY
