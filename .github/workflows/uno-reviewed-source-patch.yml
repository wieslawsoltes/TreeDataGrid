name: Materialize reviewed native source edits
on:
  push:
    branches: [codex/uno-core-port]
    paths: [.github/workflows/uno-reviewed-source-patch.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  blobs:
    if: github.repository == 'wieslawsoltes/TreeDataGrid' && github.ref == 'refs/heads/codex/uno-core-port'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Materialize exact reviewed edits without changing a branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import difflib, hashlib, json, os, pathlib, subprocess, urllib.request
          repo = 'wieslawsoltes/TreeDataGrid'
          if os.environ['GITHUB_REPOSITORY'] != repo: raise RuntimeError('Repository mismatch')
          def lines(*values): return '\n'.join(values)
          edits = [
            ('samples/TreeDataGridUnoSample/GenericPresenterRuntimeChecks.cs', 'ed9a4c7ceaff3ebc627eb97142822e10dda2cae6', [
              ('        var previous = page.Content;',
               '        await RangeReplacementRuntimeChecks.RunAsync(page);\n        var previous = page.Content;')]),
            ('src/TreeDataGrid.Controls.Uno/Primitives/TreeDataGridPresenterBase.cs', 'a9b22a15a7cae8c2a9172b48fd2ae508cac2ac71', [
              (lines('                    case NotifyCollectionChangedAction.Replace:',
                     '                        _realizedElements.ItemsReplaced(e.OldStartingIndex, e.OldItems!.Count, _recycleElementOnItemRemoved);',
                     '                        RecycleSpecialElementInRange(ref _focusedElement, ref _focusedIndex, e.OldStartingIndex, e.OldItems.Count);',
                     '                        RecycleSpecialElementInRange(ref _scrollToElement, ref _scrollToIndex, e.OldStartingIndex, e.OldItems.Count);',
                     '                        break;'),
               lines('                    case NotifyCollectionChangedAction.Replace:',
                     '                        ReplaceItems(e);', '                        break;')),
              ('            catch { _pendingReset = true; throw; }',
               '            catch (RetiredLayoutException) { _pendingReset = true; }\n            catch { _pendingReset = true; throw; }')]),
            ('tests/TreeDataGrid.Parity.Tests/DeclaredColumnFactoriesParityTests.cs', 'bacf51ece7a4b11a8816e7f513339a2f12305434', [
              ('        var row = source.Rows[0];', '        var row = (C.IRow<Model>)source.Rows[0];'),
              ('        Assert.Equal(expected.IsVirtual, actual.IsVirtual);',
               '        Assert.Equal(expected.IsVirtual && !expected.IsFinal, actual.IsVirtual && !actual.IsFinal);'),
              ('text.TryReuseCell(model, source.Rows[1])', 'text.TryReuseCell(model, (C.IRow<Model>)source.Rows[1])'),
              ('check.TryReuseCell(model, source.Rows[1])', 'check.TryReuseCell(model, (C.IRow<Model>)source.Rows[1])'),
              ('template.TryReuseCell(model, source.Rows[1])', 'template.TryReuseCell(model, (C.IRow<Model>)source.Rows[1])'),
              ('text.TryReuseCell(other, source.Rows[1])', 'text.TryReuseCell(other, (C.IRow<Model>)source.Rows[1])'),
              ('check.TryReuseCell(other, source.Rows[1])', 'check.TryReuseCell(other, (C.IRow<Model>)source.Rows[1])'),
              ('template.TryReuseCell(other, source.Rows[1])', 'template.TryReuseCell(other, (C.IRow<Model>)source.Rows[1])')])
          ]
          def blob_hash(data): return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          prepared, patch = [], []
          for name, expected, substitutions in edits:
              raw = pathlib.Path(name).read_bytes()
              if blob_hash(raw) != expected: raise RuntimeError(f'Unreviewed source input: {name}')
              text = original = raw.decode('utf-8')
              for before, after in substitutions:
                  if text.count(before) != 1: raise RuntimeError(f'Nonunique edit in {name}: {before!r}')
                  text = text.replace(before, after, 1)
              if text == original: raise RuntimeError('Empty edit')
              prepared.append((name, expected, text.encode('utf-8')))
              patch.extend(difflib.unified_diff(original.splitlines(True), text.splitlines(True), 'a/' + name, 'b/' + name))
          manifest = {'parent': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), 'files': []}
          for name, previous, data in prepared:
              request = urllib.request.Request(f'https://api.github.com/repos/{repo}/git/blobs',
                  data=json.dumps({'content': data.decode('utf-8'), 'encoding': 'utf-8'}).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'}, method='POST')
              with urllib.request.urlopen(request, timeout=30) as response: result = json.load(response)
              if result['sha'] != blob_hash(data): raise RuntimeError('Published blob hash mismatch')
              manifest['files'].append({'path': name, 'before': previous, 'sha': result['sha']})
          output = pathlib.Path('artifacts/reviewed-edits'); output.mkdir(parents=True, exist_ok=True)
          (output / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          (output / 'changes.diff').write_text(''.join(patch))
          print('REVIEWED_NATIVE_BLOBS=' + json.dumps(manifest), flush=True)
          print(''.join(patch), flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-native-source-edits
          path: artifacts/reviewed-edits
          if-no-files-found: error
